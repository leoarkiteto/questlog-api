services:
  db:
    image: postgres:17-alpine
    container_name: questlog-db
    environment:
      POSTGRES_USER: gamelog
      POSTGRES_PASSWORD: gamelog
      POSTGRES_DB: gamelog
    ports:
      - "5432:5432"
    volumes:
      - questlog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelog -d gamelog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  questlog_data:
